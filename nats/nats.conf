########## NATS server configuration ##########

# Substitution syntax: environment variables are inlined as $(VAR) at startup.
# Values are provided by docker-compose from the root .env file.

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

store_dir: "/data"

jetstream {
  max_memory_store: 1GB
  max_file_store: 2GB
}

accounts {
  APP {
    jetstream: enabled
    users: [
      { user: "appuser", password: "$(NATS_PASSWORD)" }
    ]
    permissions {
      # $JS.API.> is required by clients to manage streams/consumers and to
      # receive publish acknowledgements from JetStream.
      publish: ["users.>", "events.deadletter", "$JS.API.>"]
      # _INBOX.> covers reply subjects used by JetStream request/ack traffic.
      subscribe: ["users.>", "events.deadletter", "_INBOX.>"]
    }
  }
}

# No anonymous access: every connection must authenticate as appuser.
