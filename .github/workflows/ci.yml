name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, notification-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install shared + service dependencies
        run: |
          npm install --prefix shared --no-audit --no-fund
          npm install --prefix ${{ matrix.service }} --no-audit --no-fund

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-ci-secret-ci-secret-32ch
          MONGO_URI: mongodb://localhost:27017/ci
          NATS_URL: nats://localhost:4222
          NATS_USER: appuser
          NATS_PASSWORD: ci-pass
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images (repo-root context, as compose does)
        run: |
          docker build -f api-gateway/Dockerfile -t gateway:ci .
          docker build -f user-service/Dockerfile -t user-service:ci .
          docker build -f notification-service/Dockerfile -t notification-service:ci .

      - name: Validate docker-compose config
        # Dummy secrets satisfy the compose file's required-variable checks
        # (locally, a real .env provides them and compose fails fast without one).
        env:
          JWT_SECRET: ci-dummy-secret-ci-dummy-secret-32ch
          NATS_PASSWORD: ci-dummy-nats-password
        run: docker compose config --quiet
